name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.10.0'
          enable-cache: false
      - run: python -m pip install setuptools==82.0.1
      - name: Validate repository
        run: |
          python scripts/check_release_tree.py
          python scripts/check_public_repo.py --publication
          python scripts/check_source_secrets.py
          python scripts/check_distribution_contract.py
          test -f uv.lock || { echo "uv.lock is required for a release candidate"; exit 1; }
          python scripts/check_dependency_lock.py .
          uv lock --check
      - name: Build and verify
        shell: bash
        run: |
          set -euo pipefail
          epoch="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH="$epoch"
          rm -rf dist build src/*.egg-info
          uv build --no-build-isolation --clear -o dist .
          sdist="$(find dist -name '*.tar.gz' -print -quit)"
          wheel="$(find dist -name '*.whl' -print -quit)"
          python scripts/canonicalize_sdist.py "$sdist" --epoch "$epoch"
          python scripts/verify_release_artifacts.py --root . --wheel "$wheel" --sdist "$sdist" --epoch "$epoch"
          uv export --frozen --format cyclonedx1.5 --all-extras --output-file dist/subburn.cdx.json
          python scripts/runtime_provenance_inventory.py --output dist/runtime-provenance.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("dist/subburn.cdx.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          if data.get("bomFormat") != "CycloneDX" or not data.get("components"):
              raise SystemExit("CycloneDX SBOM is empty or malformed")
          print(f"SBOM components: {len(data['components'])}")
          PY
          rm -f dist/.gitignore
          python scripts/release_manifest.py dist
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/release-manifest.json
            dist/*.cdx.json
            dist/runtime-provenance.json
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: dist/subburn.cdx.json
      - name: Upload release-candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: subburn-release-candidate-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/release-manifest.json
            dist/*.cdx.json
            dist/runtime-provenance.json
          if-no-files-found: error
          retention-days: 14
